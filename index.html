<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF9E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>꾸미기 사진관</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #A8E6CF; --mint-light: #D4F5E9; --mint-dark: #5DBF9A;
    --peach: #FFD3B6; --peach-light: #FFF0E8; --peach-dark: #E8856A;
    --lavender: #D4C5F9; --lavender-light: #EDE8FF; --lavender-dark: #8B7BD8;
    --sky: #B8E0FF; --sky-light: #E8F5FF; --sky-dark: #5BA8E5;
    --cream: #FFF9E6; --yellow: #FFE066;
    --text-dark: #3D2C2C; --text-mid: #7A6A6A; --text-light: #B0A0A0;
    --bg-main: #FFF9E6; --white: #FFFFFF;
    --shadow: 0 4px 16px rgba(61, 44, 44, 0.08);
    --shadow-sm: 0 2px 8px rgba(61, 44, 44, 0.06);
    --border: 1.5px solid rgba(61, 44, 44, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg-main);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text-dark);
    user-select: none; -webkit-user-select: none;
    overflow: hidden;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  .screen { display: none; height: 100vh; height: 100dvh; }
  .screen.on { display: flex; }

  .card {
    background: var(--white); border: var(--border); border-radius: 24px;
    padding: 24px; box-shadow: var(--shadow);
  }
  .btn {
    border: none; border-radius: 50px; padding: 14px 28px;
    font-size: 17px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .btn:active { transform: scale(0.95); }
  .btn-mint { background: var(--mint); }
  .btn-peach { background: var(--peach); }
  .btn-primary { background: var(--mint-dark); color: #fff; }
  .btn-outline { background: #fff; border: 2px solid var(--mint); color: var(--mint-dark); }

  /* ---------- 시작 화면 ---------- */
  #start { align-items: center; justify-content: center; padding: 20px; }
  .start-card { text-align: center; max-width: 440px; width: 100%; padding: 40px 28px; }
  .start-emoji { font-size: 64px; line-height: 1; margin-bottom: 8px; }
  .start-emoji span { display: inline-block; animation: bob 2s ease-in-out infinite; }
  .start-emoji span:nth-child(2) { animation-delay: .25s; }
  .start-emoji span:nth-child(3) { animation-delay: .5s; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .start-card h1 { font-size: 30px; margin: 8px 0 6px; }
  .start-card p { color: var(--text-mid); margin: 0 0 28px; font-size: 16px; }
  .start-btn { font-size: 26px; padding: 22px 48px; background: var(--peach); box-shadow: var(--shadow); }
  .note { margin-top: 22px; font-size: 13px; color: var(--text-light); }
  .err {
    display: none; margin-top: 20px; padding: 14px 16px; border-radius: 16px;
    background: var(--peach-light); color: var(--peach-dark); font-weight: 600; font-size: 15px; line-height: 1.5;
  }

  /* ---------- 놀이 화면 ---------- */
  #play {
    display: none; padding: 12px; gap: 12px;
    grid-template-areas: "top" "stage" "side";
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-columns: minmax(0, 1fr);
  }
  #play.on { display: grid; }
  .slots { grid-area: top; display: flex; justify-content: center; gap: 8px; }
  .slot {
    width: 60px; height: 45px; border-radius: 12px;
    background: #fff center/cover no-repeat; border: 2.5px dashed var(--text-light);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--text-light); font-size: 15px;
  }
  .slot.filled { border: 2.5px solid var(--mint-dark); color: transparent; animation: popIn .4s ease; }
  .slot.next { border-color: var(--peach-dark); color: var(--peach-dark); background-color: var(--peach-light); }
  @keyframes popIn { 0% { transform: scale(.4); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }

  .stage {
    grid-area: stage; position: relative; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #cv {
    max-width: 100%; max-height: 100%; border-radius: 24px;
    background: var(--sky-light); box-shadow: var(--shadow);
    border: 4px solid #fff; touch-action: none; display: block;
  }
  .hint {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.92); border-radius: 100px; padding: 8px 18px;
    font-weight: 700; font-size: 15px; box-shadow: var(--shadow-sm);
    pointer-events: none; display: none; white-space: nowrap;
  }
  .count {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; font-size: min(38vw, 38vh); font-weight: 700; color: #fff;
    text-shadow: 0 6px 0 var(--peach-dark), 0 10px 30px rgba(61,44,44,.25);
  }
  .count.go { animation: countPop .9s ease forwards; }
  @keyframes countPop { 0% { transform: scale(.3); opacity: 0; } 25% { transform: scale(1.1); opacity: 1; } 80% { transform: scale(1); opacity: 1; } 100% { transform: scale(.9); opacity: 0; } }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; border-radius: 24px; }
  .flash.go { animation: flash .5s ease-out; }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

  .side {
    grid-area: side; display: flex; flex-direction: column; gap: 10px;
    background: #fff; border: var(--border); border-radius: 24px; padding: 12px; box-shadow: var(--shadow);
    min-height: 0;
  }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tab {
    border: 3px solid transparent; border-radius: 20px; padding: 6px 2px;
    display: flex; flex-direction: column; align-items: center; gap: 0;
    font-size: 13px; font-weight: 700; transition: transform .15s;
  }
  .tab b { font-size: 34px; line-height: 1.2; font-weight: 400; }
  .tab[data-tab="animal"] { background: var(--peach-light); }
  .tab[data-tab="hat"] { background: var(--cream); }
  .tab[data-tab="sticker"] { background: var(--lavender-light); }
  .tab[data-tab="weather"] { background: var(--sky-light); }
  .tab.on[data-tab="animal"] { border-color: var(--peach-dark); }
  .tab.on[data-tab="hat"] { border-color: #E5B93C; }
  .tab.on[data-tab="sticker"] { border-color: var(--lavender-dark); }
  .tab.on[data-tab="weather"] { border-color: var(--sky-dark); }
  .tab.on { transform: translateY(-3px); }

  .opts {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px;
    scrollbar-width: thin;
  }
  .opt {
    flex: 0 0 auto; width: 76px; height: 76px; border-radius: 22px;
    background: var(--bg-main); border: 3px solid transparent;
    font-size: 42px; line-height: 1; display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .opt:active { transform: scale(.9); }
  .opt.on { background: var(--mint-light); border-color: var(--mint-dark); }
  .opt.bounce { animation: bounce .35s ease; }
  @keyframes bounce { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

  .shoot-row { display: flex; justify-content: center; }
  .shutter {
    width: 92px; height: 92px; border-radius: 50%; border: 6px solid #fff;
    background: var(--peach-dark); font-size: 44px; line-height: 1;
    box-shadow: 0 0 0 4px var(--peach), var(--shadow);
    transition: transform .15s;
  }
  .shutter:active { transform: scale(.9); }
  .shutter:disabled { opacity: .45; }

  /* 가로 화면: 오른쪽에 도구 패널 */
  @media (orientation: landscape) and (min-width: 700px), (orientation: landscape) and (max-height: 500px) {
    #play {
      grid-template-areas: "top side" "stage side";
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-columns: minmax(0, 1fr) clamp(300px, 30vw, 380px);
    }
    .side { overflow-y: auto; }
    .opts { flex-wrap: wrap; overflow: visible; justify-content: center; }
    .shoot-row { margin-top: auto; padding-top: 6px; }
    .shutter { width: 110px; height: 110px; font-size: 52px; }
  }
  /* 낮은 가로 화면(휴대폰 가로) */
  @media (orientation: landscape) and (max-height: 500px) {
    #play { grid-template-columns: minmax(0, 1fr) 250px; padding: 8px; gap: 8px; }
    .side { padding: 8px; gap: 6px; }
    .tab b { font-size: 26px; } .tab { font-size: 11px; }
    .opt { width: 60px; height: 60px; font-size: 32px; border-radius: 18px; }
    .shutter { width: 76px !important; height: 76px !important; font-size: 36px !important; }
    .slot { width: 48px; height: 36px; }
  }
  @media (max-width: 480px) {
    #play { padding: 10px; gap: 10px; }
    .opt { width: 64px; height: 64px; font-size: 36px; }
    .tab b { font-size: 28px; }
    .shutter { width: 80px; height: 80px; font-size: 38px; }
  }

  /* ---------- 결과 화면 ---------- */
  #result {
    align-items: center; justify-content: center; gap: 24px; padding: 20px;
    overflow-y: auto; flex-wrap: wrap;
  }
  #stripImg { flex-shrink: 0;
    max-height: calc(100dvh - 40px); max-width: 100%;
    border-radius: 12px; box-shadow: 0 10px 30px rgba(61,44,44,.15);
    animation: popIn .5s ease;
  }
  .panel { width: 320px; display: flex; flex-direction: column; gap: 18px; }
  .panel h2 { margin: 0; font-size: 24px; text-align: center; }
  .label { font-weight: 700; font-size: 15px; margin-bottom: 8px; color: var(--text-mid); }
  .colors { display: flex; gap: 10px; justify-content: center; }
  .color {
    width: 48px; height: 48px; border-radius: 50%; border: 4px solid #fff;
    box-shadow: 0 0 0 2px rgba(61,44,44,.1);
  }
  .color.on { box-shadow: 0 0 0 3px var(--text-dark); }
  .input {
    width: 100%; border: 2px solid var(--mint); border-radius: 16px; padding: 12px 16px;
    font-size: 17px; font-family: inherit; outline: none; user-select: text; -webkit-user-select: text;
  }
  .input:focus { border-color: var(--mint-dark); }
  .panel .btn { width: 100%; font-size: 20px; padding: 18px; }
  .saved { text-align: center; font-weight: 700; color: var(--mint-dark); min-height: 22px; }

  @media (max-width: 768px) {
    #result { flex-direction: column; flex-wrap: nowrap; justify-content: flex-start; }
    #stripImg { max-height: none; width: min(78vw, 360px); }
    .panel { width: 100%; max-width: 420px; }
  }
</style>
</head>
<body>

<!-- 시작 화면 -->
<section id="start" class="screen on">
  <div class="card start-card">
    <div class="start-emoji"><span>🐰</span><span>👑</span><span>🌸</span></div>
    <h1>꾸미기 사진관</h1>
    <p>얼굴을 꾸미고 네컷사진을 찍어요!</p>
    <button id="startBtn" class="btn start-btn">📷 시작!</button>
    <div id="err" class="err"></div>
    <div class="note">🔒 사진은 이 기기 안에서만 만들어지고 어디에도 보내지 않아요</div>
  </div>
</section>

<!-- 놀이 화면 -->
<section id="play" class="screen">
  <div class="slots" id="slots"></div>
  <div class="stage">
    <canvas id="cv" width="960" height="720"></canvas>
    <div class="hint" id="hint"></div>
    <div class="count" id="count"></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="side">
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="animal"><b>🐰</b>동물</button>
      <button class="tab" data-tab="hat"><b>👑</b>모자</button>
      <button class="tab" data-tab="sticker"><b>⭐</b>스티커</button>
      <button class="tab" data-tab="weather"><b>❄️</b>날씨</button>
    </div>
    <div class="opts" id="opts"></div>
    <div class="shoot-row"><button class="shutter" id="shutter" aria-label="사진 찍기">📸</button></div>
  </div>
</section>

<!-- 결과 화면 -->
<section id="result" class="screen">
  <img id="stripImg" alt="네컷사진">
  <div class="card panel">
    <h2>🎉 네컷사진 완성!</h2>
    <div>
      <div class="label">🎨 테두리 색</div>
      <div class="colors" id="colors"></div>
    </div>
    <div>
      <div class="label">✏️ 이름이나 반 이름 (선택)</div>
      <input id="nameInput" class="input" maxlength="16" placeholder="예) 햇살반 지우">
    </div>
    <button id="saveBtn" class="btn btn-primary">⬇️ 사진 저장</button>
    <button id="againBtn" class="btn btn-outline">🔄 다시 찍기</button>
    <div class="saved" id="saved"></div>
  </div>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), C = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const video = document.createElement('video');
  video.playsInline = true; video.muted = true; video.setAttribute('playsinline', '');

  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const TOTAL = 4;

  // ---------- 상태 ----------
  const sel = { animal: null, hat: null, weather: null };
  let tab = 'animal';
  let stickers = [];
  let particles = [];
  let pops = [];
  const shots = [];
  let busy = false;
  let landmarker = null, faceLoading = true, lastVideoTime = -1, lastFaceAt = 0;
  const face = { fx: W/2, fy: H*0.28, nx: W/2, ny: H*0.55, mx: W/2, my: H*0.68, w: W*0.3, a: 0 };

  // ---------- 선택지 ----------
  const OPTIONS = {
    animal: [
      { id: null, icon: '🚫' }, { id: 'rabbit', icon: '🐰' }, { id: 'cat', icon: '🐱' },
      { id: 'bear', icon: '🐻' }, { id: 'dog', icon: '🐶' }, { id: 'pig', icon: '🐷' },
    ],
    hat: [
      { id: null, icon: '🚫' }, { id: 'crown', icon: '👑' }, { id: 'tiara', icon: '💎' },
      { id: 'fire', icon: '🚒' }, { id: 'chef', icon: '🧑‍🍳' }, { id: 'party', icon: '🎉' },
    ],
    sticker: ['❤️','⭐','🦖','🌈','🌸','🦋','🍓','🎈','🐥','✨','🍭','☀️','🦄','🍀'].map(e => ({ id: e, icon: e }))
      .concat([{ id: '__clear', icon: '🗑️' }]),
    weather: [
      { id: null, icon: '🚫' }, { id: 'snow', icon: '❄️' }, { id: 'sakura', icon: '🌸' },
      { id: 'rain', icon: '☔' }, { id: 'leaf', icon: '🍂' }, { id: 'bubble', icon: '🧼' },
    ],
  };

  // ---------- 소리 (Web Audio로 직접 만듦) ----------
  let AC = null;
  const audio = () => { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; };
  function tone(f1, f2, dur, type = 'sine', vol = 0.18) {
    try {
      const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
      o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const sPop = () => tone(500, 1100, 0.12);
  const sBeep = () => tone(880, 880, 0.18, 'triangle', 0.2);
  function sShutter() {
    try {
      const a = audio(), len = a.sampleRate * 0.12, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      const s = a.createBufferSource(), g = a.createGain(); g.gain.value = 0.5;
      s.buffer = buf; s.connect(g).connect(a.destination); s.start();
    } catch (e) {}
    setTimeout(() => tone(700, 1400, 0.25, 'sine', 0.12), 120);
  }

  // ---------- 카메라 ----------
  async function startCamera() {
    const err = $('err'); err.style.display = 'none';
    try {
      let stream;
      if (new URLSearchParams(location.search).has('demo')) stream = demoStream();
      else {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { name: 'Insecure' };
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 }, aspectRatio: { ideal: 4 / 3 } },
        });
      }
      video.srcObject = stream;
      await video.play();
      show('play');
      renderOpts(); renderSlots();
      loadFaceModel();
    } catch (e) {
      const msg = {
        NotAllowedError: '📷 카메라 사용을 허락해 주세요.<br>주소창 옆 카메라 아이콘에서 "허용"을 눌러주세요.',
        NotFoundError: '📷 카메라를 찾을 수 없어요.<br>카메라가 있는 기기에서 열어주세요.',
        NotReadableError: '📷 다른 앱이 카메라를 쓰고 있어요.<br>다른 앱을 끄고 다시 눌러주세요.',
        Insecure: '🔒 https 주소에서 열어야 카메라가 켜져요.<br>Netlify 같은 곳에 올려서 열어주세요.',
      }[e && e.name] || '📷 카메라를 켜지 못했어요. 다시 눌러주세요.';
      err.innerHTML = msg; err.style.display = 'block';
    }
  }

  // 테스트용 가짜 카메라 (?demo)
  function demoStream() {
    const c = document.createElement('canvas'); c.width = 640; c.height = 480;
    const x = c.getContext('2d');
    (function draw(t) {
      x.fillStyle = '#E8F5FF'; x.fillRect(0, 0, 640, 480);
      const cx = 320 + Math.sin(t / 900) * 60;
      x.fillStyle = '#FFE0C8'; x.beginPath(); x.ellipse(cx, 260, 110, 135, 0, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#3D2C2C';
      x.beginPath(); x.arc(cx - 40, 235, 10, 0, 7); x.arc(cx + 40, 235, 10, 0, 7); x.fill();
      x.strokeStyle = '#E8856A'; x.lineWidth = 6; x.beginPath(); x.arc(cx, 290, 35, 0.2, Math.PI - 0.2); x.stroke();
      requestAnimationFrame(draw);
    })(0);
    return c.captureStream(30);
  }

  // ---------- 얼굴 인식 (MediaPipe, 기기 안에서만 처리) ----------
  async function loadFaceModel() {
    if (landmarker || !faceLoading) return;
    const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    try {
      const { FaceLandmarker, FilesetResolver } = await import(V + '/vision_bundle.mjs');
      const fileset = await FilesetResolver.forVisionTasks(V + '/wasm');
      const opts = delegate => ({
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate,
        },
        runningMode: 'VIDEO', numFaces: 1,
      });
      try { landmarker = await FaceLandmarker.createFromOptions(fileset, opts('GPU')); }
      catch (e) { landmarker = await FaceLandmarker.createFromOptions(fileset, opts('CPU')); }
    } catch (e) {
      console.warn('얼굴 인식을 불러오지 못했어요', e);
    }
    faceLoading = false;
  }

  // 영상을 4:3 캔버스에 꽉 차게(가운데 자르기) 그릴 때의 위치
  function coverRect() {
    const vw = video.videoWidth || 4, vh = video.videoHeight || 3;
    const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s;
    return { dx: (W - dw) / 2, dy: (H - dh) / 2, dw, dh };
  }

  function detectFace(r) {
    if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
    lastVideoTime = video.currentTime;
    let res;
    try { res = landmarker.detectForVideo(video, performance.now()); } catch (e) { return; }
    const lm = res && res.faceLandmarks && res.faceLandmarks[0];
    if (!lm) return;
    // 거울 모드라 x를 뒤집음
    const P = i => ({ x: W - (r.dx + lm[i].x * r.dw), y: r.dy + lm[i].y * r.dh });
    const f = P(10), n = P(1), m = P(14), l = P(234), rr = P(454), e1 = P(33), e2 = P(263);
    const w = Math.hypot(l.x - rr.x, l.y - rr.y);
    let a = Math.atan2(e2.y - e1.y, e2.x - e1.x);
    if (a > Math.PI / 2) a -= Math.PI; if (a < -Math.PI / 2) a += Math.PI;
    const k = lastFaceAt && performance.now() - lastFaceAt < 500 ? 0.55 : 1;
    const L = (key, v) => face[key] += (v - face[key]) * k;
    L('fx', f.x); L('fy', f.y); L('nx', n.x); L('ny', n.y); L('mx', m.x); L('my', m.y); L('w', w); L('a', a);
    lastFaceAt = performance.now();
  }

  // ---------- 그리기 도우미 ----------
  function local(x, y, fn) {
    C.save(); C.translate(x, y); C.rotate(face.a);
    const u = face.w;
    C.lineWidth = Math.max(2, u * 0.018); C.strokeStyle = 'rgba(61,44,44,.35)'; C.lineJoin = C.lineCap = 'round';
    fn(u); C.restore();
  }
  function ell(x, y, rx, ry, rot, fill, stroke = true) {
    C.beginPath(); C.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
    C.fillStyle = fill; C.fill(); if (stroke) C.stroke();
  }
  function poly(pts, fill, stroke = true) {
    C.beginPath(); pts.forEach(([x, y], i) => i ? C.lineTo(x, y) : C.moveTo(x, y)); C.closePath();
    C.fillStyle = fill; C.fill(); if (stroke) C.stroke();
  }
  function circle(x, y, r, fill, stroke = true) { ell(x, y, r, r, 0, fill, stroke); }

  // ---------- 동물 변신 ----------
  const ANIMALS = {
    rabbit() {
      local(face.fx, face.fy, u => {
        for (const s of [-1, 1]) {
          ell(s * 0.2 * u, -0.5 * u, 0.11 * u, 0.36 * u, s * 0.15, '#FFFFFF');
          ell(s * 0.2 * u, -0.47 * u, 0.055 * u, 0.26 * u, s * 0.15, '#FFC4D0', false);
        }
      });
      local(face.nx, face.ny, u => {
        ell(0, 0, 0.05 * u, 0.038 * u, 0, '#FF9EB5');
        whiskers(u, 0.42);
      });
    },
    cat() {
      local(face.fx, face.fy, u => {
        for (const s of [-1, 1]) {
          poly([[s * 0.1 * u, -0.1 * u], [s * 0.36 * u, -0.5 * u], [s * 0.5 * u, 0.04 * u]], '#F7C58B');
          poly([[s * 0.2 * u, -0.1 * u], [s * 0.35 * u, -0.38 * u], [s * 0.43 * u, -0.04 * u]], '#FFB3C1', false);
        }
      });
      local(face.nx, face.ny, u => {
        poly([[-0.05 * u, -0.02 * u], [0.05 * u, -0.02 * u], [0, 0.04 * u]], '#FF9EB5');
        whiskers(u, 0.55);
      });
    },
    bear() {
      local(face.fx, face.fy, u => {
        for (const s of [-1, 1]) {
          circle(s * 0.4 * u, -0.08 * u, 0.17 * u, '#B07D5B');
          circle(s * 0.4 * u, -0.08 * u, 0.09 * u, '#F1C9A5', false);
        }
      });
      local(face.nx, face.ny, u => {
        ell(0, 0.05 * u, 0.17 * u, 0.12 * u, 0, 'rgba(241,201,165,.85)', false);
        ell(0, 0, 0.07 * u, 0.05 * u, 0, '#5A3A2E');
        ell(-0.02 * u, -0.015 * u, 0.02 * u, 0.012 * u, 0, 'rgba(255,255,255,.7)', false);
      });
    },
    dog() {
      local(face.fx, face.fy, u => {
        for (const s of [-1, 1]) {
          ell(s * 0.52 * u, 0.2 * u, 0.13 * u, 0.32 * u, -s * 0.3, '#C9905F');
          ell(s * 0.54 * u, 0.28 * u, 0.06 * u, 0.15 * u, -s * 0.3, '#B07A4E', false);
        }
      });
      local(face.mx, face.my, u => {
        ell(0, 0.09 * u, 0.07 * u, 0.1 * u, 0, '#FF8FA3');
        C.beginPath(); C.moveTo(0, 0.03 * u); C.lineTo(0, 0.13 * u); C.stroke();
      });
      local(face.nx, face.ny, u => {
        ell(0, 0, 0.075 * u, 0.055 * u, 0, '#3D2C2C');
        ell(-0.025 * u, -0.018 * u, 0.022 * u, 0.013 * u, 0, 'rgba(255,255,255,.7)', false);
      });
    },
    pig() {
      local(face.fx, face.fy, u => {
        for (const s of [-1, 1]) {
          poly([[s * 0.14 * u, -0.1 * u], [s * 0.42 * u, -0.4 * u], [s * 0.46 * u, -0.02 * u]], '#FFB5C5');
          poly([[s * 0.24 * u, -0.1 * u], [s * 0.4 * u, -0.29 * u], [s * 0.41 * u, -0.06 * u]], '#FF94AE', false);
        }
      });
      local(face.nx, face.ny, u => {
        ell(0, 0.01 * u, 0.14 * u, 0.1 * u, 0, '#FFB5C5');
        for (const s of [-1, 1]) ell(s * 0.045 * u, 0.01 * u, 0.022 * u, 0.035 * u, 0, '#C76B85', false);
      });
    },
  };
  function whiskers(u, len) {
    C.save(); C.lineWidth = Math.max(2, u * 0.012); C.strokeStyle = 'rgba(61,44,44,.65)';
    for (const s of [-1, 1]) for (const dy of [-0.06, 0.02, 0.1]) {
      C.beginPath(); C.moveTo(s * 0.13 * u, 0.02 * u); C.lineTo(s * len * u, dy * u); C.stroke();
    }
    C.restore();
  }

  // ---------- 모자 가게 ----------
  const HATS = {
    crown() {
      local(face.fx, face.fy, u => {
        const b = -0.05 * u;
        const peaks = [[-0.36, -0.38], [0, -0.46], [0.36, -0.38]];
        poly([[-0.33 * u, b], [0.33 * u, b], [0.36 * u, b - 0.38 * u], [0.18 * u, b - 0.2 * u], [0, b - 0.46 * u], [-0.18 * u, b - 0.2 * u], [-0.36 * u, b - 0.38 * u]], '#FFD966');
        peaks.forEach(([x, y]) => circle(x * u, b + y * u, 0.04 * u, '#FFF3B0'));
        [['-0.18', '#FF9EB5'], ['0', '#7EC8F2'], ['0.18', '#7FD8B0']].forEach(([x, c]) => circle(+x * u, b - 0.09 * u, 0.045 * u, c));
      });
    },
    tiara() {
      local(face.fx, face.fy, u => {
        const b = 0;
        poly([[-0.34, 0], [-0.24, -0.15], [-0.12, -0.09], [0, -0.3], [0.12, -0.09], [0.24, -0.15], [0.34, 0], [0.3, 0.05], [-0.3, 0.05]]
          .map(([x, y]) => [x * u, (b + y) * u]), '#EEEAF8');
        circle(0, -0.14 * u, 0.055 * u, '#B6A6F0');
        for (const s of [-1, 1]) circle(s * 0.22 * u, -0.06 * u, 0.032 * u, '#FF9EB5');
        for (const s of [-1, 1]) circle(s * 0.11 * u, -0.02 * u, 0.022 * u, '#9FDCF5');
      });
    },
    fire() {
      local(face.fx, face.fy, u => {
        const b = -0.02 * u;
        C.beginPath(); C.ellipse(0, b, 0.42 * u, 0.42 * u, 0, Math.PI, Math.PI * 2); C.closePath();
        C.fillStyle = '#F27E6B'; C.fill(); C.stroke();
        C.beginPath(); C.moveTo(0, b - 0.42 * u); C.lineTo(0, b - 0.05 * u);
        C.save(); C.lineWidth = u * 0.05; C.strokeStyle = '#E05E4A'; C.stroke(); C.restore();
        ell(0, b, 0.56 * u, 0.09 * u, 0, '#E5604D');
        circle(0, b - 0.2 * u, 0.13 * u, '#FFD966');
        C.fillStyle = '#C84A3A'; C.font = `700 ${0.1 * u}px "Noto Sans KR", sans-serif`;
        C.textAlign = 'center'; C.textBaseline = 'middle'; C.fillText('119', 0, b - 0.195 * u);
      });
    },
    chef() {
      local(face.fx, face.fy, u => {
        const b = -0.02 * u;
        C.save(); C.strokeStyle = 'rgba(61,44,44,.25)';
        circle(-0.22 * u, b - 0.36 * u, 0.18 * u, '#FFFFFF');
        circle(0.22 * u, b - 0.36 * u, 0.18 * u, '#FFFFFF');
        circle(0, b - 0.46 * u, 0.22 * u, '#FFFFFF');
        C.beginPath(); C.roundRect(-0.32 * u, b - 0.24 * u, 0.64 * u, 0.24 * u, 0.04 * u);
        C.fillStyle = '#FFFFFF'; C.fill(); C.stroke();
        C.beginPath(); C.rect(-0.3 * u, b - 0.24 * u, 0.6 * u, 0.04 * u); C.fillStyle = '#FFFFFF'; C.fill();
        C.restore();
      });
    },
    party() {
      local(face.fx, face.fy, u => {
        C.translate(0.12 * u, -0.02 * u); C.rotate(0.22);
        const tri = [[-0.2 * u, 0], [0.2 * u, 0], [0, -0.62 * u]];
        poly(tri, '#D4C5F9');
        C.save(); C.beginPath(); tri.forEach(([x, y], i) => i ? C.lineTo(x, y) : C.moveTo(x, y)); C.closePath(); C.clip();
        C.fillStyle = '#FFD3B6';
        for (let i = 0; i < 5; i++) { C.save(); C.translate(0, -i * 0.15 * u); C.rotate(-0.4); C.fillRect(-0.5 * u, -0.03 * u, u, 0.06 * u); C.restore(); }
        C.restore();
        poly(tri, 'rgba(0,0,0,0)');
        circle(0, -0.64 * u, 0.07 * u, '#FFE066');
      });
    },
  };

  // ---------- 날씨 효과 ----------
  const WEATHER = {
    snow: { n: 70, make: () => ({ snow: true, s: rnd(5, 14), vy: rnd(50, 110), vx: 0 }) },
    sakura: { n: 34, make: () => ({ e: '🌸', s: rnd(26, 48), vy: rnd(45, 95), vx: rnd(10, 40) }) },
    leaf: { n: 28, make: () => ({ e: Math.random() < 0.5 ? '🍂' : '🍁', s: rnd(30, 52), vy: rnd(55, 100), vx: rnd(-20, 20) }) },
    rain: { n: 80, make: () => ({ line: rnd(28, 52), vy: rnd(650, 950), vx: -70 }) },
    bubble: { n: 18, make: () => ({ bubble: true, s: rnd(22, 58), vy: -rnd(40, 90), vx: 0 }) },
  };
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function spawn(type, anywhere) {
    const p = WEATHER[type].make();
    p.x = rnd(0, W);
    p.y = anywhere ? rnd(0, H) : (p.bubble ? H + 60 : -60);
    p.r = rnd(0, Math.PI * 2); p.vr = rnd(-1.2, 1.2); p.ph = rnd(0, 6);
    return p;
  }
  function setWeather(type) {
    particles = type ? Array.from({ length: WEATHER[type].n }, () => spawn(type, true)) : [];
  }
  function drawWeather(dt, t) {
    const type = sel.weather; if (!type) return;
    C.save();
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.y += p.vy * dt; p.x += (p.vx + Math.sin(t / 700 + p.ph) * (p.line ? 0 : 25)) * dt; p.r += p.vr * dt;
      if (p.y > H + 70 || p.y < -80 || p.x < -80 || p.x > W + 80) { particles[i] = spawn(type, false); continue; }
      if (p.line) {
        C.strokeStyle = 'rgba(91,168,229,.75)'; C.lineWidth = 3; C.lineCap = 'round';
        C.beginPath(); C.moveTo(p.x, p.y); C.lineTo(p.x + p.vx * 0.05, p.y + p.line); C.stroke();
      } else if (p.snow) {
        C.beginPath(); C.arc(p.x, p.y, p.s, 0, Math.PI * 2);
        C.fillStyle = 'rgba(255,255,255,.95)'; C.fill();
        C.strokeStyle = 'rgba(91,168,229,.35)'; C.lineWidth = 2; C.stroke();
      } else if (p.bubble) {
        C.beginPath(); C.arc(p.x, p.y, p.s, 0, Math.PI * 2);
        C.fillStyle = 'rgba(184,224,255,.22)'; C.fill();
        C.strokeStyle = 'rgba(255,255,255,.95)'; C.lineWidth = 3; C.stroke();
        C.beginPath(); C.arc(p.x - p.s * 0.35, p.y - p.s * 0.35, p.s * 0.22, Math.PI, Math.PI * 1.6);
        C.strokeStyle = 'rgba(255,255,255,.9)'; C.lineWidth = 4; C.stroke();
      } else {
        C.save(); C.translate(p.x, p.y); C.rotate(p.r);
        C.font = `${p.s}px ${EMOJI_FONT}`; C.textAlign = 'center'; C.textBaseline = 'middle';
        C.fillText(p.e, 0, 0); C.restore();
      }
    }
    C.restore();
  }
  function drawPops(t) {
    pops = pops.filter(p => t - p.t < 300);
    for (const p of pops) {
      const k = (t - p.t) / 300;
      C.save(); C.globalAlpha = 1 - k; C.strokeStyle = '#fff'; C.lineWidth = 4;
      for (let i = 0; i < 8; i++) {
        const ang = i * Math.PI / 4, r1 = p.s * (0.6 + k), r2 = p.s * (0.9 + k * 1.2);
        C.beginPath(); C.moveTo(p.x + Math.cos(ang) * r1, p.y + Math.sin(ang) * r1);
        C.lineTo(p.x + Math.cos(ang) * r2, p.y + Math.sin(ang) * r2); C.stroke();
      }
      C.restore();
    }
  }

  // ---------- 스티커 ----------
  function addSticker(e) {
    stickers.push({ e, x: W / 2 + rnd(-260, 260), y: H / 2 + rnd(-200, 200), s: 120, tap: 0, born: performance.now() });
  }
  function drawStickers(t) {
    C.save(); C.textAlign = 'center'; C.textBaseline = 'middle';
    for (const s of stickers) {
      const age = Math.min(1, (t - s.born) / 250);
      const scale = (age < 1 ? 0.3 + age * 0.9 : 1) * (s === drag?.s ? 1.15 : 1);
      C.font = `${s.s * scale}px ${EMOJI_FONT}`;
      C.fillText(s.e, s.x, s.y);
    }
    C.restore();
  }

  let drag = null;
  function canvasPoint(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  cv.addEventListener('pointerdown', e => {
    if (busy) return;
    const p = canvasPoint(e);
    for (let i = stickers.length - 1; i >= 0; i--) {
      const s = stickers[i];
      if (Math.abs(p.x - s.x) < s.s * 0.6 && Math.abs(p.y - s.y) < s.s * 0.6) {
        const now = performance.now();
        if (now - s.tap < 350) { stickers.splice(i, 1); sPop(); return; } // 두 번 톡톡 → 삭제
        s.tap = now;
        stickers.splice(i, 1); stickers.push(s); // 맨 위로
        drag = { s, ox: p.x - s.x, oy: p.y - s.y, id: e.pointerId };
        cv.setPointerCapture(e.pointerId);
        return;
      }
    }
    if (sel.weather === 'bubble') {
      const now = performance.now();
      for (let i = 0; i < particles.length; i++) {
        const b = particles[i];
        if (Math.hypot(p.x - b.x, p.y - b.y) < b.s + 20) {
          pops.push({ x: b.x, y: b.y, s: b.s, t: now }); particles[i] = spawn('bubble', false); sPop(); return;
        }
      }
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const p = canvasPoint(e);
    drag.s.x = Math.max(0, Math.min(W, p.x - drag.ox));
    drag.s.y = Math.max(0, Math.min(H, p.y - drag.oy));
  });
  const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  // ---------- 메인 그리기 ----------
  let lastT = performance.now();
  function loop(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
    const r = coverRect();
    if (video.readyState >= 2) {
      C.save(); C.translate(W, 0); C.scale(-1, 1);
      C.drawImage(video, r.dx, r.dy, r.dw, r.dh);
      C.restore();
      detectFace(r);
    } else {
      C.fillStyle = '#E8F5FF'; C.fillRect(0, 0, W, H);
    }
    if (sel.animal) ANIMALS[sel.animal]();
    if (sel.hat) HATS[sel.hat]();
    drawWeather(dt, t);
    drawPops(t);
    drawStickers(t);
    updateHint(t);
    requestAnimationFrame(loop);
  }

  const hint = $('hint');
  function updateHint(t) {
    let msg = '';
    if (sel.animal || sel.hat) {
      if (faceLoading) msg = '⏳ 얼굴 찾을 준비 중이에요';
      else if (landmarker && t - lastFaceAt > 1500) msg = '😊 얼굴을 화면에 보여줘요';
    }
    if (hint.textContent !== msg) { hint.textContent = msg; hint.style.display = msg ? 'block' : 'none'; }
  }

  // ---------- UI ----------
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  }
  function renderOpts() {
    const box = $('opts'); box.innerHTML = '';
    for (const o of OPTIONS[tab]) {
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = o.icon;
      const on = tab !== 'sticker' && sel[tab] === o.id && o.id !== null;
      if (on) b.classList.add('on');
      b.onclick = () => {
        sPop();
        if (tab === 'sticker') {
          if (o.id === '__clear') stickers = []; else addSticker(o.id);
          b.classList.remove('bounce'); void b.offsetWidth; b.classList.add('bounce');
          return;
        }
        sel[tab] = sel[tab] === o.id ? null : o.id; // 다시 누르면 해제
        if (tab === 'weather') setWeather(sel.weather);
        renderOpts();
        const nb = $('opts').children[OPTIONS[tab].indexOf(o)];
        if (nb) nb.classList.add('bounce');
      };
      box.appendChild(b);
    }
    box.scrollLeft = 0;
  }
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    tab = b.dataset.tab; sPop();
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
    renderOpts();
  });

  function renderSlots() {
    const box = $('slots'); box.innerHTML = '';
    for (let i = 0; i < TOTAL; i++) {
      const d = document.createElement('div');
      d.className = 'slot';
      if (shots[i]) { d.classList.add('filled'); d.style.backgroundImage = `url(${shots[i].thumb})`; }
      else { d.textContent = i + 1; if (i === shots.length) d.classList.add('next'); }
      box.appendChild(d);
    }
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));
  $('shutter').onclick = async () => {
    if (busy || shots.length >= TOTAL) return;
    busy = true; $('shutter').disabled = true; audio();
    const cnt = $('count');
    for (const n of [3, 2, 1]) {
      cnt.textContent = n; cnt.classList.remove('go'); void cnt.offsetWidth; cnt.classList.add('go');
      sBeep(); await wait(900);
    }
    cnt.textContent = '';
    const shot = document.createElement('canvas'); shot.width = W; shot.height = H;
    shot.getContext('2d').drawImage(cv, 0, 0);
    const th = document.createElement('canvas'); th.width = 160; th.height = 120;
    th.getContext('2d').drawImage(shot, 0, 0, 160, 120);
    shots.push({ canvas: shot, thumb: th.toDataURL('image/jpeg', 0.8) });
    sShutter();
    const fl = $('flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
    renderSlots();
    await wait(700);
    busy = false; $('shutter').disabled = false;
    if (shots.length >= TOTAL) { await wait(300); openResult(); }
  };

  // ---------- 네컷 결과 ----------
  const FRAMES = [
    { bg: '#FFD3B6', dot: '#FFF0E8' }, { bg: '#A8E6CF', dot: '#D4F5E9' },
    { bg: '#D4C5F9', dot: '#EDE8FF' }, { bg: '#B8E0FF', dot: '#E8F5FF' }, { bg: '#FFFFFF', dot: '#FFF0E8' },
  ];
  let frame = 0;
  const colorsBox = $('colors');
  FRAMES.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'color' + (i === frame ? ' on' : ''); b.style.background = f.bg;
    b.setAttribute('aria-label', '테두리 색 ' + (i + 1));
    b.onclick = () => { frame = i; sPop(); [...colorsBox.children].forEach((x, j) => x.classList.toggle('on', j === i)); renderStrip(); };
    colorsBox.appendChild(b);
  });
  $('nameInput').addEventListener('input', () => renderStrip());

  const strip = document.createElement('canvas');
  function today() {
    const d = new Date();
    return { y: d.getFullYear(), m: String(d.getMonth() + 1).padStart(2, '0'), d: String(d.getDate()).padStart(2, '0'),
             hh: String(d.getHours()).padStart(2, '0'), mm: String(d.getMinutes()).padStart(2, '0') };
  }
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  }
  function renderStrip() {
    const S = 2, pad = 30 * S, gap = 18 * S, cw = 540 * S, ch = 405 * S, foot = 150 * S;
    const SW = 600 * S, SH = pad + ch * 4 + gap * 3 + foot;
    strip.width = SW; strip.height = SH;
    const x = strip.getContext('2d'), f = FRAMES[frame];
    x.fillStyle = f.bg; x.fillRect(0, 0, SW, SH);
    x.fillStyle = f.dot;
    for (let yy = 12 * S; yy < SH; yy += 28 * S)
      for (let xx = ((yy / (28 * S)) % 2 ? 26 : 12) * S; xx < SW; xx += 28 * S) { x.beginPath(); x.arc(xx, yy, 3 * S, 0, 7); x.fill(); }
    shots.forEach((s, i) => {
      const y = pad + i * (ch + gap);
      x.save(); x.shadowColor = 'rgba(61,44,44,.15)'; x.shadowBlur = 10 * S; x.shadowOffsetY = 3 * S;
      x.fillStyle = '#fff'; rr(x, pad - 5 * S, y - 5 * S, cw + 10 * S, ch + 10 * S, 20 * S); x.fill(); x.restore();
      x.save(); rr(x, pad, y, cw, ch, 16 * S); x.clip(); x.drawImage(s.canvas, pad, y, cw, ch); x.restore();
    });
    const fy = pad + ch * 4 + gap * 3, t = today();
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#3D2C2C';
    x.font = `700 ${34 * S}px "Noto Sans KR", sans-serif`;
    x.fillText('우리들의 네컷', SW / 2, fy + 52 * S);
    const name = $('nameInput').value.trim();
    x.font = `500 ${20 * S}px "Noto Sans KR", sans-serif`; x.fillStyle = '#7A6A6A';
    x.fillText((name ? name + '  ·  ' : '') + `${t.y}.${t.m}.${t.d}`, SW / 2, fy + 100 * S);
    x.font = `${40 * S}px ${EMOJI_FONT}`;
    x.fillText('🌈', pad + 30 * S, fy + 60 * S); x.fillText('⭐', SW - pad - 30 * S, fy + 60 * S);
    $('stripImg').src = strip.toDataURL('image/png');
  }
  async function openResult() {
    $('saved').textContent = '';
    try { await document.fonts.load(`700 40px "Noto Sans KR"`); } catch (e) {}
    renderStrip(); show('result'); tone(523, 1046, 0.4, 'triangle', 0.15);
  }

  $('saveBtn').onclick = () => {
    sPop();
    strip.toBlob(async blob => {
      const t = today(), name = `네컷사진_${t.y}${t.m}${t.d}_${t.hh}${t.mm}.png`;
      const file = new File([blob], name, { type: 'image/png' });
      const touch = matchMedia('(pointer: coarse)').matches;
      if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); $('saved').textContent = '✅ 저장했어요!'; return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      $('saved').textContent = '✅ 저장했어요!';
    }, 'image/png');
  };
  $('againBtn').onclick = () => {
    sPop(); shots.length = 0; renderSlots(); show('play');
  };

  $('startBtn').onclick = () => { audio(); sPop(); startCamera(); };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
